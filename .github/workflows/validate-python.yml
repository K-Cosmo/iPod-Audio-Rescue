name: Validate iPod rescue Python tools

on:
  push:
    paths:
      - "scripts/*.py"
      - ".github/workflows/validate-python.yml"
  workflow_dispatch:

jobs:
  mp3-rescue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python syntax checks
        run: python3 -m py_compile scripts/*.py
      - name: Offline MP3 resume and tolerant fallback smoke tests
        run: |
          python3 - <<'PY'
          import csv
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from unittest.mock import patch

          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          import convert_audio_to_mp3 as convert

          def ffmpeg(*args):
              subprocess.run(['ffmpeg', '-nostdin', '-hide_banner',
                              '-loglevel', 'error', '-y', *map(str, args)], check=True)

          with tempfile.TemporaryDirectory() as d:
              root = Path(d)
              src = root / 'source'
              out = root / 'output'
              (src / 'Album').mkdir(parents=True)
              (out / 'Album').mkdir(parents=True)
              aac = src / 'Album' / '01 - Original.m4a'
              mp3 = src / 'Album' / '02 - Existing.mp3'
              ffmpeg('-f','lavfi','-i','sine=frequency=440:duration=3',
                     '-c:a','aac','-b:a','128k',aac)
              ffmpeg('-f','lavfi','-i','sine=frequency=660:duration=3',
                     '-c:a','libmp3lame','-q:a','0',mp3)
              shutil.copyfile(mp3, out / 'Album' / mp3.name)
              # An unfinished legacy destination already contains a valid MP3.
              subprocess.run([sys.executable, 'scripts/convert_audio_to_mp3.py',
                              '--source',str(src),'--output',str(out),'--execute'],check=True)
              manifest = out / '_mp3_conversion_manifest.csv'
              with manifest.open(newline='',encoding='utf-8-sig') as f:
                  rows = list(csv.DictReader(f,delimiter=';'))
              assert len(rows) == 2
              subprocess.run([sys.executable, 'scripts/verify_mp3_conversion.py',
                              '--mp3-root', str(out), '--source', str(src), '--strict'],check=True)
              assert (out/'Album'/'01 - Original.mp3').is_file()
              assert (out/'_mp3_conversion_progress.csv').is_file()
              # Normal checkpoints should be cheap: no hashes read.
              row = next(r for r in rows if r['action'] == 'copy_mp3')
              with patch.object(convert, 'sha256', side_effect=AssertionError('unwanted rehash')):
                  convert.validate_row(row,mp3,Path('Album')/mp3.name,
                      out/'Album'/mp3.name,Path('Album')/mp3.name,
                      'copy_mp3','mp3',convert.probe(mp3),{},audit=False)
              # Force a strict-encode failure and check the tolerant fallback.
              recovery_dst = root / 'fallback.mp3'
              with patch.object(convert, 'transcode_verified',
                                side_effect=ValueError('synthetic strict failure')):
                  info, provenance = convert.transcode_auto_rescue(
                      aac,recovery_dst,convert.probe(aac),Path('Album')/aac.name,
                      Path('Album')/'01 - Original.mp3')
              assert recovery_dst.is_file()
              assert provenance and provenance['note'].startswith('AUTO_RESCUE:')
              assert abs(float(provenance['source_duration'])
                         - float(provenance['target_duration'])) <= 2.0
              assert convert.audio_info(info)[0] == 'mp3'
          print('All MP3 rescue smoke tests passed')
          PY
